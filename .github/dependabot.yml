# Each plugin pins what it deploys with; one grouped PR a week per plugin.
version: 2
updates:
  - package-ecosystem: pip
    directory: /waze-relay
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      waze-relay:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /osm-cameras
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      osm-cameras:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
